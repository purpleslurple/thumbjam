<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081c34" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ThumbJam" />
  <title>ThumbJam</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div class="game-shell">
    <main id="setupScreen" class="setup-screen is-hidden">
      <header>
        <h1>ThumbJam</h1>
      </header>

      <section id="gameSettingsPanel" class="settings-panel">
        <label class="name-setting">
          Player name:
          <input id="playerNameInput" type="text" maxlength="24" autocomplete="off" />
        </label>
        <label>
          Target drops:
          <select id="targetSelect">
            <option value="25">25</option>
            <option value="35" selected>35</option>
            <option value="50">50</option>
          </select>
        </label>
        <label>
          Difficulty:
          <select id="difficultySelect">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
      </section>

      <p id="setupStatus" class="status">Press START to play</p>

      <button id="startButton" class="action-button">START SOLO</button>
      <button id="doneSettingsButton" class="action-button secondary">Done</button>

      <section id="multiplayerPanel" class="settings-panel multiplayer-panel">
        <button id="hostButton" class="action-button secondary">Host Game</button>
        <label>
          Room:
          <input id="roomCodeInput" type="text" maxlength="4" placeholder="ABCD" />
        </label>
        <button id="joinButton" class="action-button secondary">Join Room</button>
        <label class="room-link-row">
          Join link:
          <input id="roomLinkInput" type="text" readonly placeholder="Host a game to create a link" />
        </label>
        <button id="copyLinkButton" class="action-button secondary">Copy Link</button>
      </section>
    </main>

    <main id="gameScreen" class="game-screen">
      <header class="game-header">
        <h1>ThumbJam</h1>
        <button id="settingsButton" class="settings-button" aria-label="Settings">Settings</button>
      </header>

      <div class="scoreboard">
        <div class="score-card">
          <h2 id="playerLabel">You</h2>
          <p id="playerScore">0</p>
        </div>
        <div class="score-card cpu">
          <h2 id="opponentLabel">CPU</h2>
          <p id="cpuScore">0</p>
        </div>
      </div>

      <section class="arena">
        <div class="lane">
          <div class="score-tube" aria-hidden="true">
            <div class="tower" id="playerTower"></div>
            <div class="score-float"></div>
          </div>
          <span id="playerLaneLabel">Player</span>
        </div>
        <div class="lane cpu-lane">
          <div class="score-tube" aria-hidden="true">
            <div class="tower" id="cpuTower"></div>
            <div class="score-float"></div>
          </div>
          <span id="opponentLaneLabel">CPU</span>
        </div>
      </section>

      <p id="status" class="status">Press START to play</p>

      <div class="play-zone">
        <button id="playButton" class="action-button play-button">START</button>
      </div>

      <div id="countdownOverlay" class="countdown-overlay is-hidden" aria-live="assertive">
        <span id="countdownText">3</span>
      </div>

      <div id="resultsOverlay" class="results-overlay is-hidden" aria-live="assertive">
        <div class="results-panel">
          <h2 id="resultTitle">Winner!</h2>
          <div id="resultScoreSummary" class="result-score-summary" aria-label="Final score">
            <div class="result-score-card">
              <span id="resultPlayerName">You</span>
              <strong id="resultPlayerScore">0</strong>
            </div>
            <div class="result-score-card">
              <span id="resultOpponentName">CPU</span>
              <strong id="resultOpponentScore">0</strong>
            </div>
          </div>
          <p id="resultDetail">Your drops hit the target first.</p>
          <div class="button-row">
            <button id="playAgainButton" class="action-button">Play Again</button>
            <button id="setupButton" class="action-button secondary">Settings</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
